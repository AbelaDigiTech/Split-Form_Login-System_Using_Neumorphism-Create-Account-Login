<!DOCTYPE html>
<html lang="en">
<head>

<style>

    height: 100vh;
    text-align: center;
  }

  .card {
    background: #fff;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.08), -8px -8px 20px rgba(255,255,255,0.5);

    width: 90%;

  h1 {
    color: #2b6cb0;
    font-size: 32px;
    margin-bottom: 15px;
  }

  p {
    color: #333;
    font-size: 18px;
    margin-bottom: 25px;
  }

  a {
    display: inline-block;
    background: #2b6cb0;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 500;
    transition: 0.3s;
  }

  a:hover {
    background: #1a4b8b;
  }

<div class="card">
